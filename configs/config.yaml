# FaceGate configuration. Every tunable lives here; code reads it through facegate.config.
# Override the path with FG_CONFIG=/path/to/config.yaml and the project root with FG_ROOT.

app:
  name: FaceGate
  organisation: "Your Company"        # shown in the console header
  host: 0.0.0.0
  port: 8100

paths:
  models_dir: models                  # ONNX weights (see src/facegate/vision/SPEC.md)
  data_dir: data                      # SQLite gallery + runtime settings
  database: data/facegate.db
  runtime_settings: data/settings.json

runtime:
  # ONNX Runtime providers in priority order; unavailable ones are skipped.
  providers: [CUDAExecutionProvider, CPUExecutionProvider]
  intra_op_threads: 0                 # 0 = let ONNX Runtime decide

detector:
  name: scrfd
  file: det_10g.onnx                  # SCRFD-10GF with 5-point landmarks (InsightFace buffalo_l)
  input_size: [640, 640]
  score_threshold: 0.5
  nms_threshold: 0.4
  max_faces: 20

recognizers:
  arcface:
    enabled: true
    file: w600k_r50.onnx              # ArcFace ResNet-50, WebFace600K (InsightFace buffalo_l)
    channel_order: auto               # auto | rgb | bgr  (auto: inspect the graph like InsightFace does)
    threshold: 0.30                   # cosine; tune with `make evaluate` on your own staff photos
  adaface:
    enabled: true
    file: adaface_ir101_webface12m.onnx  # export with scripts/export_adaface_onnx.py
    channel_order: bgr                # AdaFace is trained on BGR, normalised to [-1, 1]
    threshold: 0.30

matching:
  # arcface | adaface | fusion (mean of both cosines) | strict (both models must agree)
  mode: fusion
  fusion_threshold: 0.30
  margin: 0.05                        # best match must beat the runner-up by this much, else "uncertain"
  aggregate: max                      # max | mean — how a person's several templates are scored

enrollment:
  min_face_px: 80                     # shorter side of the detected box
  min_det_score: 0.70
  min_sharpness: 40.0                 # variance of Laplacian on the aligned crop
  max_samples_per_person: 20
  duplicate_threshold: 0.55           # warn if a new sample looks like someone else at this cosine
  store_thumbnails: true              # 112x112 aligned JPEG per sample, used only for the console
  # Guided video scan (People → Add person): the camera opens in a circle, a voice says "look straight",
  # "slowly turn left", "right", "chin up", "chin down", and the live video is analysed continuously. For every
  # step below the sharpest, best-framed frame inside its pose range is kept; at the end those are enrolled.
  # Nobody has to hold a pose. yaw ≈ sin(angle), + = person turned to THEIR left; pitch is relative to their
  # frontal frame, − = chin up. Ranges are [min, max]; omit a key to not check it. Widen ranges if an angle is missed.
  guided:
    auto_start_for_new_person: true   # open guided capture right after "Add person → Continue"
    auto_submit: true                 # enroll the best frames as soon as the scan ends
    voice: true                       # speak the instructions (console has a mute button)
    capture_max_side: 1280            # resolution of analysed / enrolled frames
    detect_size: 384                  # detector input for the scan loop: ~3x faster than 640, fine for close faces
    best_window_ms: 800               # after a direction's angles are found, keep looking this long for a sharper frame
    max_motion: 0.06                  # frames where the head moved more than this per 100 ms (2-frame average) are
                                      # skipped as motion-blurred. Still-head jitter is ~0.02–0.03; raise if "Hold still"
                                      # never clears on a noisy camera, lower for stricter stillness
    still_diff: 0.012                 # image stillness: face-thumbnail change per 100 ms at which a frame's score
                                      # halves (>3x = never used). Still ≈ 0.009, slow drift ≈ 0.016, turning ≈ 0.08.
                                      # Raise to 0.02 on a noisy/dark camera if "Hold still" never clears
    remind_ms: 4000                   # direction not finished yet? repeat the (more specific) instruction this often.
                                      # The scan never moves on by itself: video stays on until every angle has a photo
    max_center_offset: 0.22           # face centre must be within this fraction of the frame from the middle
    phase_prompts:                    # spoken + shown for each direction
      center: "Look straight at the camera"
      left: "Slowly turn your head to your left"
      right: "Now slowly turn your head to your right"
      up: "Look straight, and tilt your chin up"
      down: "Now tilt your chin down"
    guide_style: dot                  # dot | hold | faceid | avatar | points (default; the scan window has a picker)
    animations:                       # Lottie JSON files under frontend/assets/ ("" = off); see assets/anim/README.md
      intro: anim/face-scan.json      # "turn your head like this", shown once per browser session before the scan
      success: anim/success.json      # plays when every angle is captured
    intro_ms: 2500
    steps:
      - {key: front,        prompt: "Look straight at the camera",           hint: center, yaw: [-0.15, 0.15]}
      - {key: left_slight,  prompt: "Turn slightly to your left",            hint: left,  yaw: [0.12, 0.30],   pitch: [-0.15, 0.15]}
      - {key: left,         prompt: "Keep turning to your left",             hint: left,  yaw: [0.30, 0.85],   pitch: [-0.18, 0.18]}
      - {key: right_slight, prompt: "Turn slightly to your right",           hint: right, yaw: [-0.30, -0.12], pitch: [-0.15, 0.15]}
      - {key: right,        prompt: "Keep turning to your right",            hint: right, yaw: [-0.85, -0.30], pitch: [-0.18, 0.18]}
      - {key: up,           prompt: "Look straight, then tilt your chin up", hint: up,    yaw: [-0.25, 0.25],  pitch: [-1.0, -0.05]}
      - {key: down,         prompt: "Now tilt your chin down",               hint: down,  yaw: [-0.25, 0.25],  pitch: [0.05, 1.0]}

events:
  log_recognitions: true
  cooldown_seconds: 60                # do not log the same person again within this window
  retention_days: 90                  # events older than this are purged on startup
  log_unknown: true

api:
  max_upload_mb: 8
  cors_origins: []                    # same-origin by default; add origins only if you host the UI elsewhere

auth:
  # Console sign-in. First start creates user "admin" with a random password written to
  # data/initial_admin_credentials.txt — sign in, then delete that file. Manage users with `facegate user …`.
  session_hours: 8
  cookie_name: fg_session
  cookie_secure: false                # set true when served over HTTPS
  password_min_length: 8
  password_iterations: 600000         # PBKDF2-SHA256
  max_failed_per_user: 5              # password failures per username within the window → locked
  max_failed_face_per_client: 10      # face failures per client IP within the window → locked
  lock_window_minutes: 15
  face_login: true                    # users linked to a gallery person can sign in with their face
  face_mode: strict                   # strict = every loaded recognizer must agree on the same person
  detect_size: [640, 640]             # SCRFD input for sign-in frames (same as enrollment); [320, 320] ≈ 4x faster detection
  quality:                            # live-camera checks before a face sign-in attempt
    min_det_score: 0.60
    good_det_score: 0.75
    min_face_frac: 0.18               # face width / frame width
    max_face_frac: 0.80
    min_face_px: 80
    max_center_offset: 0.30
    min_sharpness: 40.0
    min_brightness: 60.0
    max_brightness: 210.0
    max_yaw: 0.25
    max_roll_deg: 15.0
  liveness:                           # passive anti-spoof; missing file → check skipped (see SECURITY.md)
    mode: enforce                     # enforce | log | off
    file: face_antispoof_minifas_int8.onnx
    threshold: 0.0
